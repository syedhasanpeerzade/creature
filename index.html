<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080a0f">
<title>The Hollow — 3D Skeletal Creature</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080a0f;
    color: #e8e5dc;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    background:
        radial-gradient(ellipse at 50% 46%, rgba(25, 40, 53, 0.54), transparent 62%),
        #080a0f;
}

#scene {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
}

.interface {
    position: fixed;
    z-index: 1;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(22px, 4vw, 48px);
    pointer-events: none;
}

.brand {
    display: grid;
    gap: 8px;
    width: fit-content;
}

.eyebrow,
.hint,
.status {
    color: rgba(186, 199, 207, 0.66);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
}

.brand h1 {
    color: #e9e4d7;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(26px, 4vw, 39px);
    font-weight: 400;
    letter-spacing: 0.015em;
}

.footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;
    letter-spacing: 0.13em;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #87d8ee;
    box-shadow: 0 0 12px rgba(101, 204, 238, 0.8);
}

.error {
    position: fixed;
    z-index: 2;
    inset: 50% auto auto 50%;
    width: min(440px, calc(100vw - 40px));
    padding: 20px 22px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(225, 232, 240, 0.16);
    border-radius: 12px;
    background: rgba(9, 13, 19, 0.94);
    color: #e9e4d7;
    font-size: 14px;
    line-height: 1.6;
    text-align: center;
}

.error[hidden] {
    display: none;
}

@media (max-width: 540px) {
    .interface {
        padding: 24px;
    }

    .hint {
        max-width: 150px;
        font-size: 9px;
        line-height: 1.7;
        text-align: right;
    }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive 3D skeletal creature that follows the pointer"></canvas>
<main class="interface" aria-hidden="true">
    <header class="brand">
        <span class="eyebrow">A small thing from the dark</span>
        <h1>The Hollow</h1>
    </header>
    <footer class="footer">
        <span class="status"><span class="status-dot"></span><span id="creature-state">Waiting for you</span></span>
        <span class="hint">Move your cursor to guide it</span>
    </footer>
</main>
<div class="error" id="scene-error" role="alert" hidden></div>
<script type="module">
const errorPanel = document.getElementById("scene-error");

function showError(message) {
    errorPanel.textContent = message;
    errorPanel.hidden = false;
}

try {
    const THREE = await import("https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js");
    const canvas = document.getElementById("scene");
    const stateLabel = document.getElementById("creature-state");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x080a0f, 0.018);
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.zoom = 1;
    camera.updateProjectionMatrix();
    camera.position.set(-1.4, 6.5, 10.5);
    camera.lookAt(-1.4, 0, 0);
    const cameraOffset = new THREE.Vector3(0, 6.5, 10.5);
    const cameraFocus = new THREE.Vector3(-1.4, 0, 0);
    const cameraPosition = new THREE.Vector3();

    const boneMaterial = new THREE.MeshStandardMaterial({
        color: 0x6c5649,
        metalness: 0.32,
        roughness: 0.58,
        emissive: 0x120e0c
    });
    const jointMaterial = new THREE.MeshStandardMaterial({
        color: 0x443832,
        metalness: 0.28,
        roughness: 0.62,
        emissive: 0x100b09
    });
    const eyeMaterial = new THREE.MeshStandardMaterial({
        color: 0x40211a,
        emissive: 0x000000,
        emissiveIntensity: 0,
        metalness: 0.12,
        roughness: 0.22
    });
    const pupilMaterial = new THREE.MeshStandardMaterial({
        color: 0x080607,
        roughness: 0.18
    });
    const mawMaterial = new THREE.MeshStandardMaterial({
        color: 0x090607,
        roughness: 0.9
    });
    const fangMaterial = new THREE.MeshStandardMaterial({
        color: 0xb7a28c,
        metalness: 0.22,
        roughness: 0.34
    });
    const tailGlowMaterial = new THREE.MeshStandardMaterial({
        color: 0x71321b,
        emissive: 0xa84219,
        emissiveIntensity: 0.58,
        roughness: 0.38
    });
    const antennaGlowMaterial = new THREE.MeshStandardMaterial({
        color: 0x8a5c38,
        emissive: 0xc37a3a,
        emissiveIntensity: 0.5,
        roughness: 0.34
    });
    const skullMaterial = new THREE.MeshStandardMaterial({
        color: 0x382824,
        metalness: 0.3,
        roughness: 0.62,
        emissive: 0x160706
    });
    const fleshMaterial = new THREE.MeshStandardMaterial({
        color: 0x332321,
        metalness: 0.12,
        roughness: 0.72
    });
    const armorMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x34221f,
        metalness: 0.43,
        roughness: 0.48,
        clearcoat: 0.32,
        clearcoatRoughness: 0.38
    });
    const armorHighlightMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x715347,
        metalness: 0.48,
        roughness: 0.42,
        clearcoat: 0.42,
        clearcoatRoughness: 0.3
    });

    scene.add(new THREE.HemisphereLight(0x9bbbd0, 0x11151a, 1.7));
    const keyLight = new THREE.DirectionalLight(0xd8e8f0, 3.1);
    keyLight.position.set(2, 8, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.left = -12;
    keyLight.shadow.camera.right = 12;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -10;
    scene.add(keyLight);
    const rimLight = new THREE.PointLight(0x9b4032, 7, 18);
    rimLight.position.set(-3, 2.5, -4);
    scene.add(rimLight);
    const antennaLight = new THREE.PointLight(0xc88b4f, 0.62, 2.8, 2);

    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0x090c11, roughness: 0.92, metalness: 0.08 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.84;
    floor.receiveShadow = true;
    scene.add(floor);
    const grid = new THREE.GridHelper(80, 80, 0x283640, 0x18232b);
    grid.position.y = -0.835;
    grid.material.transparent = true;
    grid.material.opacity = 0.2;
    scene.add(grid);
    const creatureRoot = new THREE.Group();
    scene.add(creatureRoot);

    const up = new THREE.Vector3(0, 1, 0);
    const forwardAxis = new THREE.Vector3(1, 0, 0);
    const yawAxis = new THREE.Vector3(0, 1, 0);
    const pitchAxis = new THREE.Vector3(0, 0, 1);
    const rollAxis = new THREE.Vector3(1, 0, 0);
    const headRotation = new THREE.Quaternion();
    const worldUp = new THREE.Vector3(0, 1, 0);
    const raycaster = new THREE.Raycaster();
    const cursorPlane = new THREE.Plane(worldUp, 0);
    const cursor = new THREE.Vector2();
    const cursorWorld = new THREE.Vector3(2.97, 0.22, 0);
    const hitPoint = new THREE.Vector3();
    const heading = new THREE.Vector3(1, 0, 0);
    const pointerDirection = new THREE.Vector3(1, 0, 0);
    const targetPointerDirection = new THREE.Vector3(1, 0, 0);
    const movementVelocity = new THREE.Vector3();
    const emergenceStartedAt = performance.now();
    let lastPointerWorld = cursorWorld.clone();
    let pointerSeen = false;
    let previousTime = 0;
    let gaitDistance = 0;
    const strideLength = 0.78;
    let movementEnergy = 0;
    let nextMuscleAt = performance.now() + 3200;
    let muscleStartedAt = -10000;
    let muscleDuration = 1;
    let muscleCenter = 18;
    let muscleWidth = 3;
    let muscleStrength = 0;
    let muscleRecoil = false;
    let lastPointerMove = 0;
    let nextBlinkAt = 0;
    let blinkStartedAt = -1000;
    let nextPauseAt = performance.now() + 6500;
    let pauseUntil = 0;
    let nextCuriosityAt = 4200;
    let curiosityStartedAt = -10000;
    let curiosityDuration = 1;
    let curiosityTilt = 0;
    let nextSniffAt = 9000;
    let sniffStartedAt = -10000;
    let sniffDuration = 1;

    function makeBone(radius = 0.022, material = boneMaterial) {
        const mesh = new THREE.Mesh(
            new THREE.CylinderGeometry(radius * 0.72, radius, 1, 7, 1),
            material
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        creatureRoot.add(mesh);
        return mesh;
    }

    function makeJoint(radius = 0.035) {
        const mesh = new THREE.Mesh(
            new THREE.SphereGeometry(radius, 8, 6),
            jointMaterial
        );
        mesh.castShadow = true;
        creatureRoot.add(mesh);
        return mesh;
    }

    function makeOrganicMesh(geometry, material, scale) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.scale.set(...scale);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        creatureRoot.add(mesh);
        return mesh;
    }

    function makeSpike(radius) {
        const mesh = new THREE.Mesh(
            new THREE.ConeGeometry(radius, 1, 7),
            armorHighlightMaterial
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        creatureRoot.add(mesh);
        return mesh;
    }

    function makeHeadSpike(start, end, radius, material = armorHighlightMaterial) {
        const direction = end.clone().sub(start);
        const mesh = new THREE.Mesh(
            new THREE.ConeGeometry(radius, direction.length(), 7),
            material
        );
        mesh.position.copy(start).add(end).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(up, direction.normalize());
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        head.add(mesh);
        return mesh;
    }

    function placeBone(mesh, start, end) {
        const direction = end.clone().sub(start);
        const length = direction.length();
        mesh.position.copy(start).add(end).multiplyScalar(0.5);
        mesh.scale.set(1, Math.max(length, 0.001), 1);
        mesh.quaternion.setFromUnitVectors(up, direction.normalize());
    }

    function pointSegmentDistanceSquaredXZ(point, start, end) {
        const dx = end.x - start.x;
        const dz = end.z - start.z;
        const lengthSquared = dx * dx + dz * dz;
        const amount = lengthSquared > 1e-8
            ? Math.max(0, Math.min(1, ((point.x - start.x) * dx + (point.z - start.z) * dz) / lengthSquared))
            : 0;
        const nearestX = start.x + dx * amount;
        const nearestZ = start.z + dz * amount;
        const offsetX = point.x - nearestX;
        const offsetZ = point.z - nearestZ;
        return offsetX * offsetX + offsetZ * offsetZ;
    }

    const ribCount = 50;
    const musclePulses = new Float32Array(ribCount);
    const segmentSpacing = 0.13;
    const spineClearance = 0.78;
    const spine = Array.from({ length: ribCount }, (_, index) =>
        new THREE.Vector3(2.25 - index * segmentSpacing, 0.22, 0)
    );
    const spineBones = Array.from({ length: ribCount - 1 }, () => makeBone(0.018));
    const spineJoints = spine.map(() => makeJoint(0.023));
    const bodySections = [];
    const organicGeometry = new THREE.SphereGeometry(1, 12, 10);
    const armorGeometry = new THREE.IcosahedronGeometry(1, 1);
    const shieldShape = new THREE.Shape();
    shieldShape.moveTo(0.27, 0);
    shieldShape.quadraticCurveTo(0.13, 0.13, -0.1, 0.15);
    shieldShape.lineTo(-0.3, 0.07);
    shieldShape.quadraticCurveTo(-0.38, 0, -0.3, -0.07);
    shieldShape.lineTo(-0.1, -0.15);
    shieldShape.quadraticCurveTo(0.13, -0.13, 0.27, 0);
    const shieldGeometry = new THREE.ExtrudeGeometry(shieldShape, {
        depth: 0.055,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.025,
        bevelThickness: 0.025
    });
    shieldGeometry.translate(0, 0, -0.0275);
    for (let index = 2; index < ribCount - 3; index += 2) {
        const taper = 1 - Math.max(0, index / ribCount - 0.58) * 1.35;
        bodySections.push({
            index,
            flesh: makeOrganicMesh(organicGeometry, fleshMaterial, [0.22, 0.23 * taper, 0.38 * taper]),
            dorsal: makeOrganicMesh(armorGeometry, armorHighlightMaterial.clone(), [0.24, 0.12 * taper, 0.3 * taper]),
            sidePlates: [-1, 1].map(() => {
                const plate = new THREE.Mesh(shieldGeometry, armorHighlightMaterial);
                plate.castShadow = true;
                plate.receiveShadow = true;
                creatureRoot.add(plate);
                return plate;
            }),
            sideScales: [-1, 1].map(() => {
                const scale = new THREE.Mesh(shieldGeometry, armorMaterial);
                scale.castShadow = true;
                scale.receiveShadow = true;
                creatureRoot.add(scale);
                return scale;
            }),
            spine: makeSpike(0.09 * taper)
        });
    }

    const ribs = spine.filter((_, index) => index % 2 === 0).map((_, ribIndex) => ({
        index: ribIndex * 2,
        sides: [-1, 1].map(() => ({
            upper: makeBone(0.011),
            lower: makeBone(0.012),
            joint: makeJoint(0.019)
        })),
        crossbar: ribIndex % 3 === 0 ? makeBone(0.008) : null
    }));

    const legsAt = [5, 11, 17, 23, 29, 35, 41, 46];
    const legs = [];
    for (let pair = 0; pair < legsAt.length; pair++) {
        for (const side of [-1, 1]) {
            legs.push({
                index: legsAt[pair],
                pair,
                side,
                coxa: makeBone(0.034, armorMaterial),
                upper: makeBone(0.031, armorMaterial),
                lower: makeBone(0.023, boneMaterial),
                hip: makeJoint(0.04),
                knee: makeJoint(0.047),
                foot: makeJoint(0.027),
                toes: [makeBone(0.016, armorHighlightMaterial), makeBone(0.016, armorHighlightMaterial), makeBone(0.016, armorHighlightMaterial)]
            });
        }
    }

    const tailCount = 16;
    const tailPoints = Array.from({ length: tailCount + 1 }, (_, index) =>
        new THREE.Vector3(2.25 - (ribCount - 1) * segmentSpacing - index * 0.105, 0.22, 0)
    );
    const tailBones = Array.from({ length: tailCount }, (_, index) =>
        makeBone(0.014 * (1 - index / (tailCount + 2)))
    );
    const tailJoints = tailPoints.slice(0, -1).map((_, index) => makeJoint(0.02 * (1 - index / (tailCount + 2))));
    const tailSections = Array.from({ length: tailCount - 2 }, (_, index) => {
        const taper = 1 - (index + 1) / (tailCount + 1);
        return {
            index: index + 1,
            flesh: makeOrganicMesh(organicGeometry, fleshMaterial, [0.09 * taper, 0.095 * taper, 0.15 * taper]),
            plate: makeOrganicMesh(armorGeometry, armorMaterial, [0.095 * taper, 0.045 * taper, 0.15 * taper]),
            spine: makeSpike(0.05 * taper)
        };
    });
    const tailLanterns = [2, 4, 6, 8, 10, 12, 14].map(index => {
        const taper = 1 - index / (tailCount + 1);
        const lantern = new THREE.Mesh(
            new THREE.SphereGeometry(Math.max(0.022, 0.058 * taper), 10, 8),
            tailGlowMaterial
        );
        lantern.scale.set(1.25, 0.65, 1);
        creatureRoot.add(lantern);
        return { index, mesh: lantern };
    });
    const tailLight = new THREE.PointLight(0xc84c20, 1, 3.2, 2);
    creatureRoot.add(tailLight);
    const head = new THREE.Group();
    creatureRoot.add(head);
    head.add(antennaLight);
    const skull = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 1), skullMaterial);
    skull.position.set(0.19, 0.08, 0);
    skull.scale.set(1.45, 0.72, 0.82);
    skull.castShadow = true;
    head.add(skull);
    const snout = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.72, 6), armorMaterial);
    snout.position.set(0.42, 0.01, 0);
    snout.rotation.z = -Math.PI / 2;
    snout.scale.set(1, 0.78, 0.88);
    snout.castShadow = true;
    head.add(snout);
    const maw = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 8), mawMaterial);
    maw.position.set(0.39, -0.125, 0);
    maw.scale.set(1.55, 0.46, 0.8);
    head.add(maw);
    const browPlates = [
        [0.22, 0.29, 0, [0.32, 0.075, 0.23]],
        [0.39, 0.19, -0.18, [0.2, 0.08, 0.11]],
        [0.39, 0.19, 0.18, [0.2, 0.08, 0.11]]
    ].map(([x, y, z, scale]) => {
        const plate = new THREE.Mesh(armorGeometry, armorHighlightMaterial);
        plate.position.set(x, y, z);
        plate.scale.set(...scale);
        plate.castShadow = true;
        head.add(plate);
        return plate;
    });

    const eyeSockets = [];
    const eyes = [];
    const eyeGeometry = new THREE.SphereGeometry(0.057, 14, 10);
    const socketGeometry = new THREE.TorusGeometry(0.084, 0.022, 7, 16);
    const pupils = [];
    for (const side of [-1, 1]) {
        const socket = new THREE.Mesh(socketGeometry, armorMaterial);
        socket.position.set(0.24, 0.12, side * 0.255);
        if (side < 0) socket.rotation.y = Math.PI;
        head.add(socket);
        eyeSockets.push(socket);
        const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
        eye.position.set(0.25, 0.12, side * 0.27);
        head.add(eye);
        eyes.push(eye);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 8), pupilMaterial);
        pupil.position.set(0.278, 0.12, side * 0.298);
        pupil.scale.set(0.62, 1.5, 0.6);
        head.add(pupil);
        pupils.push(pupil);
    }
    for (const side of [-1, 1]) {
        const smallerEye = new THREE.Mesh(
            new THREE.SphereGeometry(0.028, 10, 8),
            eyeMaterial
        );
        smallerEye.position.set(0.47, 0.19, side * 0.17);
        head.add(smallerEye);
        eyes.push(smallerEye);
    }
    const headSpikes = [
        makeHeadSpike(new THREE.Vector3(0.04, 0.26, -0.16), new THREE.Vector3(-0.28, 0.68, -0.2), 0.13),
        makeHeadSpike(new THREE.Vector3(0.04, 0.26, 0.16), new THREE.Vector3(-0.28, 0.68, 0.2), 0.13),
        makeHeadSpike(new THREE.Vector3(-0.04, 0.24, 0), new THREE.Vector3(-0.52, 0.55, 0), 0.105),
        makeHeadSpike(new THREE.Vector3(0.08, -0.11, -0.2), new THREE.Vector3(0.57, -0.35, -0.31), 0.08),
        makeHeadSpike(new THREE.Vector3(0.08, -0.11, 0.2), new THREE.Vector3(0.57, -0.35, 0.31), 0.08)
    ];
    const fangs = [
        [-1, 0.26], [-1, 0.43], [1, 0.26], [1, 0.43]
    ].map(([side, x]) => {
        const fang = new THREE.Mesh(new THREE.ConeGeometry(0.036, 0.18, 7), fangMaterial);
        fang.position.set(x, -0.16, side * 0.13);
        fang.rotation.z = Math.PI;
        fang.castShadow = true;
        head.add(fang);
        return fang;
    });

    const headBones = [
        makeBone(0.017), makeBone(0.017),
        makeBone(0.014), makeBone(0.014),
        makeBone(0.012), makeBone(0.012),
        makeBone(0.009), makeBone(0.009)
    ];
    const headJoints = Array.from({ length: 6 }, () => makeJoint(0.022));
    const antennaBones = Array.from({ length: 6 }, () => makeBone(0.009, armorHighlightMaterial));
    const antennaJoints = Array.from({ length: 6 }, () => makeJoint(0.016));
    const antennaTips = [-1, 1].map(side => {
        const tip = new THREE.Mesh(
            new THREE.SphereGeometry(0.05, 12, 10),
            antennaGlowMaterial
        );
        tip.scale.set(0.72, 0.72, 1.1);
        head.add(tip);
        return { side, mesh: tip };
    });
    const antennaShock = Array.from({ length: 5 }, (_, index) => {
        const arc = new THREE.Line(
            new THREE.BufferGeometry(),
            new THREE.LineBasicMaterial({
                color: index % 2 === 0 ? 0x7cf5ff : 0xffd36f,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            })
        );
        arc.frustumCulled = false;
        head.add(arc);
        return { phase: index * 2.1 + Math.random() * 3.2, arc };
    });
    head.add(...headBones, ...headJoints, ...antennaBones, ...antennaJoints);

    let headLookYaw = 0;

    function updateAntennaShock(time, stiffness) {
        antennaShock.forEach(({ phase, arc }, index) => {
            const start = antennaTips[0].mesh.position;
            const end = antennaTips[1].mesh.position;
            const intensity = Math.max(0.12, stiffness * 0.9 + 0.18);
            const flicker = reducedMotion ? 1 : Math.max(0, Math.sin(time * 0.035 + phase));
            const centerT = 0.28 + index * 0.11;
            const gap = new THREE.Vector3().subVectors(end, start);
            const center = new THREE.Vector3().lerpVectors(start, end, centerT);
            const points = [-1, -0.42, 0.08, 0.48, 1].map((offset, pointIndex) => {
                const point = center.clone().addScaledVector(gap, offset * 0.045);
                if (pointIndex > 0 && pointIndex < 4) {
                    point.x += Math.sin(time * 0.06 + phase + pointIndex * 2.4) * 0.045;
                    point.y += Math.cos(time * 0.05 + phase + pointIndex * 1.7) * 0.045;
                }
                return point;
            });

            arc.geometry.dispose();
            arc.geometry = new THREE.BufferGeometry().setFromPoints(points);
            arc.material.opacity = 0.25 + flicker * intensity * 0.65;
            arc.visible = intensity > 0.2 && (reducedMotion ? index === 2 : flicker > 0.35);
        });
    }

    function setHeadPose(time, blink, deltaSeconds, breath) {
        head.position.copy(spine[0]);
        const sniffProgress = Math.max(0, Math.min(1, (time - sniffStartedAt) / sniffDuration));
        const sniff = Math.sin(sniffProgress * Math.PI);
        head.position.y += Math.sin(time * 0.0034) * movementEnergy * 0.006
            + breath * 0.004 - sniff * 0.02;
        head.quaternion.setFromUnitVectors(forwardAxis, heading);
        const targetAngle = Math.atan2(cursorWorld.z - spine[0].z, cursorWorld.x - spine[0].x);
        const headingAngle = Math.atan2(heading.z, heading.x);
        const angleDifference = Math.atan2(
            Math.sin(targetAngle - headingAngle),
            Math.cos(targetAngle - headingAngle)
        );
        const desiredLookYaw = pointerSeen ? Math.max(-0.48, Math.min(0.48, -angleDifference)) : 0;
        headLookYaw += (desiredLookYaw - headLookYaw) * (1 - Math.exp(-2.8 * deltaSeconds));
        const curiosityProgress = Math.max(0, Math.min(1, (time - curiosityStartedAt) / curiosityDuration));
        const curiosity = Math.sin(curiosityProgress * Math.PI);
        const tilt = reducedMotion ? 0 : curiosity * curiosityTilt;
        const gaitPhase = gaitDistance / strideLength * Math.PI * 2;
        const nod = reducedMotion ? 0 : Math.sin(gaitPhase) * 0.025 * movementEnergy;
        head.quaternion.multiply(headRotation.setFromAxisAngle(yawAxis, headLookYaw));
        head.quaternion.multiply(headRotation.setFromAxisAngle(pitchAxis, nod - sniff * 0.11));
        head.quaternion.multiply(headRotation.setFromAxisAngle(rollAxis, tilt));
        if (!reducedMotion) {
            head.quaternion.multiply(headRotation.setFromAxisAngle(
                pitchAxis,
                Math.sin(time * 0.0017) * 0.008
            ));
        }
        const jawPulse = reducedMotion ? 0 : Math.sin(time * 0.0015) * 0.009 + sniff * 0.012;
        const jawLeftHinge = new THREE.Vector3(0.02, -0.11, -0.18);
        const jawRightHinge = new THREE.Vector3(0.02, -0.11, 0.18);
        const jawLeftFront = new THREE.Vector3(0.57, -0.12 - jawPulse, -0.12);
        const jawRightFront = new THREE.Vector3(0.57, -0.12 - jawPulse, 0.12);
        const jawLeftBack = new THREE.Vector3(0.08, -0.24 - jawPulse, -0.18);
        const jawRightBack = new THREE.Vector3(0.08, -0.24 - jawPulse, 0.18);
        const headPairs = [
            [jawLeftHinge, jawLeftFront], [jawRightHinge, jawRightFront],
            [jawLeftFront, jawLeftBack], [jawRightFront, jawRightBack],
            [jawLeftBack, jawLeftHinge], [jawRightBack, jawRightHinge]
        ];
        headPairs.forEach(([start, end], index) => placeBone(headBones[index], start, end));

        for (let tooth = 0; tooth < 2; tooth++) {
            const x = 0.25 + tooth * 0.11;
            placeBone(
                headBones[6 + tooth],
                new THREE.Vector3(x, -0.015, tooth === 0 ? -0.12 : 0.12),
                new THREE.Vector3(x + 0.015, -0.105 - jawPulse, tooth === 0 ? -0.11 : 0.11)
            );
        }
        const joints = [jawLeftHinge, jawRightHinge, jawLeftFront, jawRightFront, jawLeftBack, jawRightBack];
        joints.forEach((point, index) => {
            headJoints[index].position.copy(point);
            headJoints[index].scale.setScalar(index < 2 ? 1 : 0.78);
        });
        eyes.forEach(eye => eye.scale.y = 1 - blink * 0.82);
        pupils.forEach(pupil => pupil.scale.y = 1 - blink * 0.82);
        fangs.forEach(fang => {
            fang.position.y = -0.16 - jawPulse;
        });

        const wave = reducedMotion
            ? 0
            : Math.sin(time * 0.0009) * 0.025 + Math.sin(time * 0.0017 + 1.2) * 0.012 - sniff * 0.045;
        const antennaRoots = [
            new THREE.Vector3(0.24, 0.22, -0.16),
            new THREE.Vector3(0.24, 0.22, 0.16)
        ];
        antennaRoots.forEach((root, sideIndex) => {
            const side = sideIndex === 0 ? -1 : 1;
            const bend = new THREE.Vector3(0.4, 0.4 + wave, side * 0.25);
            const outer = new THREE.Vector3(0.78, 0.56 + wave * 1.4, side * 0.46);
            const tip = new THREE.Vector3(1.32, 0.62 + wave * 1.8, side * 0.63);
            const offset = sideIndex * 3;
            const points = [root, bend, outer, tip];
            for (let segment = 0; segment < 3; segment++) {
                placeBone(antennaBones[offset + segment], points[segment], points[segment + 1]);
                antennaJoints[offset + segment].position.copy(points[segment]);
            }
            antennaTips[sideIndex].mesh.position.copy(tip);
        });
        antennaLight.position.set(0.92, 0.56 + wave, 0);
        const antennaCharge = pointerSeen ? 0.68 + movementEnergy * 1.1 : 0.26;
        updateAntennaShock(time, antennaCharge);
        antennaGlowMaterial.emissiveIntensity = 0.46 + antennaCharge * 0.4
            + (reducedMotion ? 0 : Math.sin(time * 0.0013) * 0.05);
    }

    function worldPointer(event) {
        const bounds = canvas.getBoundingClientRect();
        cursor.set(
            ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
            -((event.clientY - bounds.top) / bounds.height) * 2 + 1
        );
        raycaster.setFromCamera(cursor, camera);
        if (raycaster.ray.intersectPlane(cursorPlane, hitPoint)) {
            const delta = hitPoint.clone().sub(lastPointerWorld);
            delta.y = 0;
            if (delta.lengthSq() > 0.0025) targetPointerDirection.copy(delta.normalize());
            cursorWorld.copy(hitPoint);
            lastPointerWorld.copy(hitPoint);
            pointerSeen = true;
            lastPointerMove = performance.now();
            pauseUntil = 0;
        }
    }

    window.addEventListener("pointermove", worldPointer, { passive: true });

    function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);

    function updateSpine(deltaSeconds, time, breath) {
        pointerDirection.lerp(
            targetPointerDirection,
            1 - Math.exp(-5 * deltaSeconds)
        ).normalize();
        const pointerIdleFor = time - lastPointerMove;
        if (pointerSeen && pointerIdleFor > 700 && time >= nextPauseAt) {
            pauseUntil = time + 320 + Math.random() * 420;
            nextPauseAt = time + 5800 + Math.random() * 7200;
        }
        const target = pointerSeen
            ? cursorWorld.clone().addScaledVector(pointerDirection, -0.18)
            : spine[0].clone();
        if (time < pauseUntil) target.copy(spine[0]);
        target.y = 0.22;
        const previousHead = spine[0].clone();
        const spring = target.clone().sub(spine[0]);
        movementVelocity.x += (spring.x * 18 - movementVelocity.x * 7.5) * deltaSeconds;
        movementVelocity.z += (spring.z * 18 - movementVelocity.z * 7.5) * deltaSeconds;
        if (movementVelocity.length() > 2.6) movementVelocity.setLength(2.6);
        spine[0].addScaledVector(movementVelocity, deltaSeconds);
        const movement = spine[0].clone().sub(previousHead);
        if (movement.lengthSq() > 0.000004) {
            const desiredHeading = movement.clone().normalize();
            desiredHeading.y = 0;
            heading.lerp(desiredHeading.normalize(), 1 - Math.exp(-3.4 * deltaSeconds)).normalize();
        }
        const speed = previousHead.distanceTo(spine[0]) / Math.max(deltaSeconds, 0.001);
        const targetEnergy = Math.min(0.62, speed / 2.5);
        const energyRate = targetEnergy > movementEnergy ? 2.2 : 1.05;
        movementEnergy += (targetEnergy - movementEnergy) * (1 - Math.exp(-energyRate * deltaSeconds));
        gaitDistance += previousHead.distanceTo(spine[0]);

        for (let index = 1; index < spine.length; index++) {
            const previous = spine[index - 1];
            const direction = index === 1
                ? heading
                : spine[index - 2].clone().sub(previous).normalize();
            const backward = direction.clone().negate();
            const desired = previous.clone().addScaledVector(backward, segmentSpacing);
            spine[index].lerp(desired, 1 - Math.exp(-5.2 * deltaSeconds));
            const offset = spine[index].clone().sub(previous);
            if (offset.lengthSq() < 0.000001) offset.copy(backward);
            const referenceAngle = Math.atan2(backward.z, backward.x);
            const candidateAngle = Math.atan2(offset.z, offset.x);
            const difference = Math.atan2(
                Math.sin(candidateAngle - referenceAngle),
                Math.cos(candidateAngle - referenceAngle)
            );
            const bendLimit = 0.11 + movementEnergy * 0.07;
            const bend = Math.max(-bendLimit, Math.min(bendLimit, difference));
            const candidateAngles = [referenceAngle + bend];
            const collisionStart = Math.max(0, index - 7);
            const proposedPoint = new THREE.Vector3(
                previous.x + Math.cos(referenceAngle + bend) * segmentSpacing,
                0,
                previous.z + Math.sin(referenceAngle + bend) * segmentSpacing
            );
            let hasCollision = false;
            for (let segment = 0; segment < collisionStart; segment++) {
                if (
                    pointSegmentDistanceSquaredXZ(
                        proposedPoint,
                        spine[segment],
                        spine[segment + 1]
                    ) < spineClearance * spineClearance
                ) {
                    hasCollision = true;
                    break;
                }
            }

            if (hasCollision) {
                candidateAngles.length = 0;
                for (let sample = 0; sample <= 16; sample++) {
                    candidateAngles.push(referenceAngle - bendLimit + 2 * bendLimit * sample / 16);
                }
            }

            let bestAngle = candidateAngles[0];
            let bestClearance = -Infinity;
            for (const angle of candidateAngles) {
                const candidate = new THREE.Vector3(
                    previous.x + Math.cos(angle) * segmentSpacing,
                    0,
                    previous.z + Math.sin(angle) * segmentSpacing
                );
                let clearance = Infinity;
                for (let segment = 0; segment < collisionStart; segment++) {
                    clearance = Math.min(
                        clearance,
                        pointSegmentDistanceSquaredXZ(candidate, spine[segment], spine[segment + 1])
                    );
                }
                if (clearance > bestClearance) {
                    bestAngle = angle;
                    bestClearance = clearance;
                }
                if (!hasCollision || clearance >= spineClearance * spineClearance) {
                    bestAngle = angle;
                    break;
                }
            }

            const rearWeight = index / (spine.length - 1);
            const bodyPhase = gaitDistance / strideLength * Math.PI * 2 - index * 0.2;
            const bodySway = reducedMotion
                ? 0
                : Math.sin(bodyPhase) * 0.001 * Math.pow(rearWeight, 1.35)
                    * Math.min(1, movementEnergy / 0.35);
            const bodyLift = reducedMotion
                ? 0
                : Math.sin(bodyPhase * 2 - 0.4) * movementEnergy * 0.0003;
            const musclePulse = musclePulses[index];
            const sideX = -Math.sin(bestAngle);
            const sideZ = Math.cos(bestAngle);
            spine[index].set(
                previous.x + Math.cos(bestAngle) * segmentSpacing + sideX * (bodySway + musclePulse),
                0.22 + bodyLift + breath * 0.001 - Math.abs(musclePulse) * 0.08,
                previous.z + Math.sin(bestAngle) * segmentSpacing + sideZ * (bodySway + musclePulse)
            );
        }
    }

    function updateCreature(time, deltaSeconds) {
        const emergenceProgress = reducedMotion
            ? 1
            : Math.max(0, Math.min(1, (time - emergenceStartedAt) / 2800));
        const emergenceEase = emergenceProgress * emergenceProgress * (3 - 2 * emergenceProgress);
        creatureRoot.position.y = -1.05 * (1 - emergenceEase);
        creatureRoot.scale.setScalar(0.96 + 0.04 * emergenceEase);
        const breath = reducedMotion ? 0 : Math.sin(time * 0.00165);
        if (!reducedMotion && time >= nextMuscleAt) {
            muscleStartedAt = time;
            muscleDuration = 420 + Math.random() * 280;
            muscleRecoil = Math.random() < 0.28;
            muscleCenter = muscleRecoil
                ? 6 + Math.random() * 12
                : 7 + Math.random() * (ribCount - 14);
            muscleWidth = muscleRecoil ? 4.5 : 2.4 + Math.random() * 1.4;
            muscleStrength = (0.001 + Math.random() * 0.0008) * (Math.random() < 0.5 ? -1 : 1);
            nextMuscleAt = time + 6500 + Math.random() * 9000;
        }
        const muscleProgress = (time - muscleStartedAt) / muscleDuration;
        if (!reducedMotion && muscleProgress >= 0 && muscleProgress <= 1) {
            const twitch = Math.sin(muscleProgress * Math.PI * (muscleRecoil ? 2 : 3))
                * Math.sin(muscleProgress * Math.PI)
                * Math.exp(-muscleProgress * 0.35)
                * muscleStrength;
            for (let index = 0; index < musclePulses.length; index++) {
                const distance = (index - muscleCenter) / muscleWidth;
                musclePulses[index] = twitch * Math.exp(-0.5 * distance * distance);
            }
        } else {
            musclePulses.fill(0);
        }
        updateSpine(deltaSeconds, time, breath);
        for (let index = 0; index < spineBones.length; index++) {
            placeBone(spineBones[index], spine[index], spine[index + 1]);
            spineJoints[index].position.copy(spine[index]);
        }
        spineJoints[spineJoints.length - 1].position.copy(spine[spine.length - 1]);

        for (const section of bodySections) {
            const base = spine[section.index];
            const before = spine[Math.max(0, section.index - 1)];
            const after = spine[Math.min(spine.length - 1, section.index + 1)];
            const tangent = before.clone().sub(after).setY(0).normalize();
            const yaw = Math.atan2(-tangent.z, tangent.x);
            const sideAxis = new THREE.Vector3(-tangent.z, 0, tangent.x);
            const position = section.index / (ribCount - 1);
            const taper = 1 - Math.max(0, position - 0.58) * 1.35;
            const breathing = 1 + breath * 0.001;
            const contraction = Math.abs(musclePulses[section.index]);
            section.flesh.position.set(base.x, base.y - 0.09, base.z);
            section.flesh.rotation.y = yaw;
            section.flesh.scale.y = 0.18 * taper * breathing * (1 - contraction * 0.5);
            section.flesh.scale.z = 0.38 * taper * breathing * (1 - contraction * 0.2);
            section.dorsal.material.emissive.setHex(0xb9662d);
            section.dorsal.material.emissiveIntensity = 0.04;
            section.dorsal.position.set(base.x - tangent.x * 0.015, base.y + 0.075, base.z - tangent.z * 0.015);
            section.dorsal.rotation.set(0, yaw, -0.16);
            section.sidePlates.forEach((plate, sideIndex) => {
                const side = sideIndex === 0 ? -1 : 1;
                plate.position.copy(base)
                    .add(new THREE.Vector3(0, -0.055, 0))
                    .addScaledVector(sideAxis, side * 0.405 * taper);
                plate.rotation.set(0, yaw + (side < 0 ? Math.PI : 0), side * 0.1);
                plate.scale.set(0.66 * taper, 1.2 * taper, 1);
                const scale = section.sideScales[sideIndex];
                scale.position.copy(base)
                    .add(new THREE.Vector3(0, -0.22 * taper, 0))
                    .addScaledVector(sideAxis, side * 0.365 * taper);
                scale.rotation.set(0, yaw + (side < 0 ? Math.PI : 0), side * 0.24);
                scale.scale.set(0.58 * taper, 0.9 * taper, 0.8);
            });
            const spikeBase = base.clone().add(new THREE.Vector3(0, 0.105, 0));
            const spikeLength = 0.5 * (1 - position * 0.55);
            const spikeTip = spikeBase.clone()
                .addScaledVector(tangent, -spikeLength * 0.72)
                .add(new THREE.Vector3(0, spikeLength, 0));
            placeBone(section.spine, spikeBase, spikeTip);
        }

        for (const rib of ribs) {
            const base = spine[rib.index];
            const before = spine[Math.max(0, rib.index - 1)];
            const after = spine[Math.min(spine.length - 1, rib.index + 1)];
            const tangent = before.clone().sub(after).setY(0).normalize();
            const sideAxis = new THREE.Vector3(-tangent.z, 0, tangent.x);
            const position = rib.index / (ribCount - 1);
            const taper = position < 0.78
                ? 1 - Math.max(0, position - 0.52) * 1.05
                : 0.51 - (position - 0.78) * 1.5;
            const breathing = 1 + breath * 0.001;
            const musclePulse = musclePulses[rib.index];
            const width = Math.max(0.09, 0.37 * taper * breathing * (1 - Math.abs(musclePulse) * 0.2));
            const top = base.clone().add(new THREE.Vector3(0, 0.01, 0));
            const tips = [];
            rib.sides.forEach((bones, sideIndex) => {
                const side = sideIndex === 0 ? -1 : 1;
                const shoulder = top.clone()
                    .addScaledVector(tangent, -0.045)
                    .add(new THREE.Vector3(0, -0.08, 0))
                    .addScaledVector(sideAxis, side * (width * 0.7 + musclePulse * 0.2));
                const tip = top.clone()
                    .addScaledVector(tangent, -0.13)
                    .add(new THREE.Vector3(0, -0.43 * taper, 0))
                    .addScaledVector(sideAxis, side * width * 1.3);
                placeBone(bones.upper, top, shoulder);
                placeBone(bones.lower, shoulder, tip);
                bones.joint.position.copy(shoulder);
                tips.push(tip);
            });
            if (rib.crossbar) placeBone(rib.crossbar, tips[0], tips[1]);
        }

        for (const leg of legs) {
            const base = spine[leg.index];
            const before = spine[Math.max(0, leg.index - 1)];
            const after = spine[Math.min(spine.length - 1, leg.index + 1)];
            const tangent = before.clone().sub(after).setY(0).normalize();
            const sideAxis = new THREE.Vector3(-tangent.z, 0, tangent.x);
            const legGaitRate = 1.5;
            const cycle = ((gaitDistance / strideLength * legGaitRate + leg.pair * 0.12 + (leg.side < 0 ? 0 : 0.5)) % 1 + 1) % 1;
            const stanceRatio = 0.62;
            const stanceStride = strideLength * stanceRatio;
            let step;
            let lift = 0;
            if (cycle < stanceRatio) {
                const stanceProgress = cycle / stanceRatio;
                step = (0.5 - stanceProgress) * stanceStride;
            } else {
                const progress = (cycle - stanceRatio) / (1 - stanceRatio);
                const eased = progress * progress * (3 - 2 * progress);
                step = (-0.5 + eased) * stanceStride;
                lift = Math.sin(progress * Math.PI) * 0.28;
            }
            const gaitBlend = Math.min(1, movementEnergy / 0.55);
            step *= gaitBlend;
            lift *= gaitBlend;
            const hip = base.clone().add(new THREE.Vector3(0, 0.04, 0))
                .addScaledVector(sideAxis, leg.side * 0.12);
            const coxaEnd = base.clone()
                .addScaledVector(tangent, step * 0.18)
                .add(new THREE.Vector3(0, -0.07, 0))
                .addScaledVector(sideAxis, leg.side * 0.27);
            const knee = base.clone()
                .addScaledVector(tangent, step * 0.55 - 0.06)
                .add(new THREE.Vector3(0, -0.29 - lift * 0.4, 0))
                .addScaledVector(sideAxis, leg.side * 0.43);
            const foot = base.clone()
                .addScaledVector(tangent, step + 0.06)
                .add(new THREE.Vector3(0, -1.02 + lift, 0))
                .addScaledVector(sideAxis, leg.side * 0.58);
            placeBone(leg.coxa, hip, coxaEnd);
            placeBone(leg.upper, coxaEnd, knee);
            placeBone(leg.lower, knee, foot);
            leg.hip.position.copy(hip);
            leg.knee.position.copy(knee);
            leg.foot.position.copy(foot);
            const toeOffsets = [-1, 0, 1];
            toeOffsets.forEach((offset, index) => {
                const toeTip = foot.clone()
                    .addScaledVector(tangent, 0.2)
                    .addScaledVector(sideAxis, leg.side * 0.09 + offset * 0.065)
                    .add(new THREE.Vector3(0, -0.035, 0));
                placeBone(leg.toes[index], foot, toeTip);
            });
        }

        const tailDirection = spine[spine.length - 1].clone()
            .sub(spine[spine.length - 2]).normalize();
        const sideAxis = new THREE.Vector3(-tailDirection.z, 0, tailDirection.x);
        tailPoints[0].copy(spine[spine.length - 1]);
        for (let index = 1; index < tailPoints.length; index++) {
            const wave = reducedMotion
                ? 0
                : Math.sin(gaitDistance * 3.2 - index * 0.38) * 0.11 * movementEnergy
                    + Math.sin(time * 0.001 - index * 0.24) * 0.025;
            const direction = tailDirection.clone().addScaledVector(sideAxis, wave).normalize();
            tailPoints[index].copy(tailPoints[index - 1]).addScaledVector(direction, index < 10 ? 0.105 : 0.09);
            placeBone(tailBones[index - 1], tailPoints[index - 1], tailPoints[index]);
            if (tailJoints[index - 1]) tailJoints[index - 1].position.copy(tailPoints[index - 1]);
        }
        for (const lantern of tailLanterns) {
            lantern.mesh.position.copy(tailPoints[lantern.index]);
            lantern.mesh.position.y += 0.035 * (1 - lantern.index / (tailCount + 1));
        }
        tailLight.position.copy(tailPoints[tailCount]);
        tailLight.position.y += 0.06;
        tailGlowMaterial.emissiveIntensity = 0.52
            + (reducedMotion ? 0 : Math.sin(time * 0.002) * 0.08);
        for (const section of tailSections) {
            const base = tailPoints[section.index];
            const tangent = tailPoints[section.index - 1].clone().sub(tailPoints[section.index + 1]).normalize();
            const taper = 1 - section.index / (tailCount + 1);
            const yaw = Math.atan2(-tangent.z, tangent.x);
            section.flesh.position.copy(base);
            section.flesh.rotation.y = yaw;
            section.plate.position.copy(base).add(new THREE.Vector3(0, 0.035 * taper, 0));
            section.plate.rotation.y = yaw;
            const spikeBase = base.clone().add(new THREE.Vector3(0, 0.055 * taper, 0));
            const spikeTip = spikeBase.clone()
                .addScaledVector(tangent, -0.09 * taper)
                .add(new THREE.Vector3(0, 0.21 * taper, 0));
            placeBone(section.spine, spikeBase, spikeTip);
        }

        const idleFor = performance.now() - lastPointerMove;
        const isIdle = !pointerSeen || idleFor > 1200;
        if (!reducedMotion && isIdle && time >= nextCuriosityAt) {
            curiosityStartedAt = time;
            curiosityDuration = 1100 + Math.random() * 1100;
            curiosityTilt = (Math.random() < 0.5 ? -1 : 1) * (0.1 + Math.random() * 0.08);
            nextCuriosityAt = time + 4200 + Math.random() * 5600;
        }
        if (!reducedMotion && isIdle && time >= nextSniffAt) {
            sniffStartedAt = time;
            sniffDuration = 620 + Math.random() * 280;
            nextSniffAt = time + 9500 + Math.random() * 6500;
        }
        const blinkDuration = 170;
        if (time >= nextBlinkAt) {
            blinkStartedAt = time;
            nextBlinkAt = time + (Math.random() < 0.16 ? 260 : 3100 + Math.random() * 3900);
        }
        const blink = Math.max(0, 1 - Math.abs(time - blinkStartedAt) / blinkDuration);
        setHeadPose(time, blink, deltaSeconds, breath);
        stateLabel.textContent = !pointerSeen
            ? "Waiting for you"
            : idleFor > 500 ? "Watching quietly" : movementEnergy > 0.2 ? "Scurrying along" : "Following you";
    }

    function animate(timestamp) {
        const deltaSeconds = previousTime
            ? Math.min((timestamp - previousTime) / 1000, 0.05)
            : 1 / 60;
        previousTime = timestamp;
        updateCreature(timestamp, deltaSeconds);
        cameraFocus.copy(spine[0]).add(spine[spine.length - 1]).multiplyScalar(0.5);
        cameraFocus.add(creatureRoot.position);
        cameraFocus.y = 0;
        cameraPosition.copy(cameraFocus).add(cameraOffset);
        camera.position.lerp(cameraPosition, 1 - Math.exp(-1.1 * deltaSeconds));
        camera.lookAt(cameraFocus);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    nextBlinkAt = performance.now() + 2200;
    requestAnimationFrame(animate);
} catch (error) {
    console.error("Unable to initialize the 3D creature.", error);
    showError("The 3D scene could not start. Check your connection and make sure WebGL is enabled, then reload the page.");
}
</script>
